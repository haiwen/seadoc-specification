site_name: SeaDoc Specification
site_author: seafile
docs_dir: ./docs
site_url: https://haiwen.github.io/seadoc-specification/seadoc/

repo_name: haiwen/seadoc-specification
repo_url: https://github.com/haiwen/seadoc-specification/
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 seafile

theme:
  name: material
  highlightjs: true
  hljs_languages:
    - yaml
    - bash
    - javascript
    - python
  # icon:
  logo: assets/seafile-logo.png
  favicon: assets/favicon.ico
  # features:
  # - tabs
  palette:
    primary: deep orange
    accent:

plugins:
  - search # necessary for search to work
  - awesome-pages

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/haiwen/seadoc-specification/

# Extensions
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.attr_list
  - markdown.extensions.codehilite:
      guess_lang: true
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
      toc_depth: "1-4"
  - pymdownx.superfences

# Page tree
nav:
  - Introduction: index.md
  - SeaDoc Document Model: support-types.md
  - Node Reference:
      - Text: data-structure/text.md
      - Block Elements:
          - Paragraph: data-structure/paragraph.md
          - Heading: data-structure/header.md
          - Blockquote: data-structure/blockquote.md
          - Callout: data-structure/callout.md
          - List: data-structure/list.md
          - Checklist Item: data-structure/check_list_item.md
          - Code Block: data-structure/code_block.md
          - Table: data-structure/table.md
          - Multi Column: data-structure/multi_column.md
          - Divider: data-structure/divider.md
          - Image Block: data-structure/image_block.md
          - Formula: data-structure/formula.md
          - Embed Link: data-structure/embed_link.md
          - Video: data-structure/video.md
          - Whiteboard: data-structure/whiteboard.md
      - Inline Elements:
          - Link: data-structure/link.md
          - Image: data-structure/image.md
          - File Link: data-structure/file_link.md
          - SeaDoc Link: data-structure/sdoc_link.md
